name: CI/CD Practice

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ansckddnjs17/simplecicd

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v6

      - name: Docker 이미지 빌드
        run: docker build -t "$IMAGE:$GITHUB_SHA" .

      - name: GHCR 로그인
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Docker 이미지 업로드
        run: docker push "$IMAGE:$GITHUB_SHA"